[project]
name = "vox-orchestrator"
version = "0.1.0"
description = "Latency-optimised orchestration for real-time healthcare voice agents (Jev decision layer + speculative pipeline)"
requires-python = ">=3.10"
dependencies = ["matplotlib>=3.7", "httpx>=0.27", "scikit-learn>=1.3"]

[project.optional-dependencies]
live = ["websockets>=12", "sounddevice>=0.4.6", "numpy>=1.24"]
dev = ["pytest>=8"]

[project.scripts]
vox = "vox.cli:main"

[tool.setuptools.packages.find]
include = ["vox*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
